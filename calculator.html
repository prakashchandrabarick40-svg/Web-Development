<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <style>
        :root {
            font-family: Arial, sans-serif;
            color: #1f2937;
            background: #e0f2fe;
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            place-items: center;
            padding: 20px;
        }

        .calculator {
            width: min(100%, 340px);
            padding: 20px;
            border-radius: 18px;
            background: #ffffff;
            box-shadow: 0 12px 30px rgb(15 23 42 / 18%);
        }

        h1 {
            margin: 0 0 16px;
            font-size: 1.5rem;
            text-align: center;
        }

        #display {
            width: 100%;
            margin-bottom: 16px;
            padding: 16px;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            background: #f8fafc;
            color: #0f172a;
            font-size: 2rem;
            text-align: right;
        }

        .history-toggle {
            width: 100%;
            min-height: 44px;
            margin-bottom: 16px;
            background: #dbeafe;
            color: #1d4ed8;
            font-size: 1rem;
        }

        .history-toggle:hover {
            background: #bfdbfe;
        }

        .history {
            margin-bottom: 16px;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            background: #f8fafc;
        }

        .history[hidden] {
            display: none;
        }

        .history-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .history-header h2 {
            margin: 0;
            font-size: 1rem;
        }

        .clear-history {
            min-height: 32px;
            padding: 4px 8px;
            background: #e2e8f0;
            font-size: 0.8rem;
        }

        .history-list {
            display: grid;
            gap: 6px;
            max-height: 160px;
            margin: 0;
            padding: 0;
            overflow-y: auto;
            list-style: none;
        }

        .history-list li {
            padding: 6px 8px;
            border-radius: 6px;
            background: #e2e8f0;
            font-size: 0.95rem;
            text-align: right;
        }

        .empty-history {
            color: #64748b;
            text-align: center;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            min-height: 58px;
            border: 0;
            border-radius: 10px;
            background: #e2e8f0;
            color: #0f172a;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: bold;
        }

        button:hover {
            background: #cbd5e1;
        }

        button:active {
            transform: scale(0.97);
        }

        .operator,
        .equals {
            background: #2563eb;
            color: #ffffff;
        }

        .operator:hover,
        .equals:hover {
            background: #1d4ed8;
        }

        .clear {
            background: #fecaca;
            color: #991b1b;
        }

        .clear:hover {
            background: #fca5a5;
        }

        .wide {
            grid-column: span 2;
        }
    </style>
</head>
<body>
    <main class="calculator">
        <h1>Simple Calculator</h1>
        <input id="display" type="text" value="0" aria-label="Calculator display" readonly>
        <button class="history-toggle" type="button" data-action="toggle-history" aria-expanded="false">
            Show History
        </button>
        <section class="history" aria-labelledby="history-title" hidden>
            <div class="history-header">
                <h2 id="history-title">Calculation History</h2>
                <button class="clear-history" type="button" data-action="clear-history">Clear</button>
            </div>
            <ul class="history-list">
                <li class="empty-history">No calculations yet.</li>
            </ul>
        </section>

        <div class="buttons">
            <button class="clear wide" type="button" data-action="clear">Clear</button>
            <button type="button" data-action="backspace" aria-label="Backspace">⌫</button>
            <button class="operator" type="button" data-operation="/">÷</button>

            <button type="button" data-number="7">7</button>
            <button type="button" data-number="8">8</button>
            <button type="button" data-number="9">9</button>
            <button class="operator" type="button" data-operation="*">×</button>

            <button type="button" data-number="4">4</button>
            <button type="button" data-number="5">5</button>
            <button type="button" data-number="6">6</button>
            <button class="operator" type="button" data-operation="-">−</button>

            <button type="button" data-number="1">1</button>
            <button type="button" data-number="2">2</button>
            <button type="button" data-number="3">3</button>
            <button class="operator" type="button" data-operation="+">+</button>

            <button class="wide" type="button" data-number="0">0</button>
            <button type="button" data-action="decimal">.</button>
            <button class="equals" type="button" data-action="equals">=</button>
        </div>
    </main>

    <script>
        const display = document.querySelector("#display");
        let firstNumber = null;
        let operation = null;
        let waitingForSecondNumber = false;
        const history = [];
        const historyPanel = document.querySelector(".history");
        const historyList = document.querySelector(".history-list");
        const historyToggle = document.querySelector(".history-toggle");

        function operationSymbol(operator) {
            return { "+": "+", "-": "−", "*": "×", "/": "÷" }[operator];
        }

        function renderHistory() {
            historyList.innerHTML = "";
            if (history.length === 0) {
                const emptyMessage = document.createElement("li");
                emptyMessage.className = "empty-history";
                emptyMessage.textContent = "No calculations yet.";
                historyList.append(emptyMessage);
                return;
            }

            history.forEach((entry) => {
                const item = document.createElement("li");
                item.textContent = entry;
                historyList.append(item);
            });
        }

        function addToHistory(expression) {
            history.unshift(expression);
            renderHistory();
        }

        function show(value) {
            display.value = value;
        }

        function enterNumber(number) {
            if (display.value === "Error" || waitingForSecondNumber) {
                show(number);
                waitingForSecondNumber = false;
                return;
            }

            show(display.value === "0" ? number : display.value + number);
        }

        function enterDecimal() {
            if (display.value === "Error" || waitingForSecondNumber) {
                show("0.");
                waitingForSecondNumber = false;
                return;
            }

            if (!display.value.includes(".")) {
                show(display.value + ".");
            }
        }

        function calculate(left, right, operator) {
            switch (operator) {
                case "+":
                    return left + right;
                case "-":
                    return left - right;
                case "*":
                    return left * right;
                case "/":
                    return right === 0 ? null : left / right;
                default:
                    return right;
            }
        }

        function chooseOperation(nextOperation) {
            if (display.value === "Error") {
                return;
            }

            const currentNumber = Number(display.value);
            if (operation !== null && !waitingForSecondNumber) {
                const result = calculate(firstNumber, currentNumber, operation);
                if (result === null) {
                    show("Error");
                    firstNumber = null;
                    operation = null;
                    return;
                }
                show(String(result));
                firstNumber = result;
            } else {
                firstNumber = currentNumber;
            }

            operation = nextOperation;
            waitingForSecondNumber = true;
        }

        function finishCalculation() {
            if (operation === null || firstNumber === null || display.value === "Error") {
                return;
            }

            const secondNumber = Number(display.value);
            const result = calculate(firstNumber, secondNumber, operation);
            addToHistory(`${firstNumber} ${operationSymbol(operation)} ${secondNumber} = ${result === null ? "Error" : result}`);
            show(result === null ? "Error" : String(result));
            firstNumber = null;
            operation = null;
            waitingForSecondNumber = true;
        }

        function clearCalculator() {
            show("0");
            firstNumber = null;
            operation = null;
            waitingForSecondNumber = false;
        }

        function backspace() {
            if (display.value === "Error" || waitingForSecondNumber) {
                clearCalculator();
                return;
            }

            show(display.value.length > 1 ? display.value.slice(0, -1) : "0");
        }

        function toggleHistory() {
            historyPanel.hidden = !historyPanel.hidden;
            historyToggle.setAttribute("aria-expanded", String(!historyPanel.hidden));
            historyToggle.textContent = historyPanel.hidden ? "Show History" : "Hide History";
        }

        document.querySelector(".buttons").addEventListener("click", (event) => {
            const button = event.target.closest("button");
            if (!button) {
                return;
            }

            if (button.dataset.number !== undefined) {
                enterNumber(button.dataset.number);
            } else if (button.dataset.operation !== undefined) {
                chooseOperation(button.dataset.operation);
            } else if (button.dataset.action === "decimal") {
                enterDecimal();
            } else if (button.dataset.action === "equals") {
                finishCalculation();
            } else if (button.dataset.action === "clear") {
                clearCalculator();
            } else if (button.dataset.action === "backspace") {
                backspace();
            }
        });

        document.querySelector(".calculator").addEventListener("click", (event) => {
            const button = event.target.closest("button");
            if (!button) {
                return;
            }

            if (button.dataset.action === "toggle-history") {
                toggleHistory();
            } else if (button.dataset.action === "clear-history") {
                history.length = 0;
                renderHistory();
            }
        });

        document.addEventListener("keydown", (event) => {
            if (/^[0-9]$/.test(event.key)) {
                enterNumber(event.key);
            } else if (event.key === ".") {
                enterDecimal();
            } else if (["+", "-", "*", "/"].includes(event.key)) {
                chooseOperation(event.key);
            } else if (event.key === "Enter" || event.key === "=") {
                finishCalculation();
            } else if (event.key === "Escape") {
                clearCalculator();
            } else if (event.key === "Backspace") {
                backspace();
            }
        });
    </script>
</body>
</html>
