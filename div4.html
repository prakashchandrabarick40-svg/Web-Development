<!DOCTYPE html>
<html>
    <head>
        <title>Div Examples</title>
        <style>
        
            .red-box {
                background-color: red;
                color: white;
            }
        
            .blue-border {
                width: 300px;
                height: 150px;
                border: 2px solid blue;
            }
        
            .padding-div {
                border: 1px solid black;
                padding: 20px;
            }
        
            .margin-div {
                border: 1px solid black;
                margin: 30px;
            }
        </style>
    </head>
    <body>
        <div>welcome to html</div>
    
        <div class="red-box">This is a red box with white text</div>

        <div class="blue-border">Blue border div</div>
        
        <div class="padding-div">This div has 20px padding inside</div>
    
        <div class="margin-div">This div has 30px margin outside</div>
    </body>
</html>
