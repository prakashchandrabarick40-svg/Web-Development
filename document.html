    <!DOCTYPE html>
<html lang="en">
<head>
    <title>Image Box</title>
    <style>
        .image-box {
            width: 150px;
            border: 2px solid black;
            padding: 20px;
            text-align: center;
        }
        img {
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="image-box">
        <img src="ROBOT.jpeg" alt="ROBOT">
        <p>Robot from 2190</p>

    </div>
</body>
</html>
