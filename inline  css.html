<!DOCTYPE html>
<html>
<head>
    <title>Internal CSS Demo</title>
    <style>
        p {
            color: blue;
        }

        body {
            background-color: gray;
        }

        h1 {
            text-align: center;
        }

        button {
            background-color: green;
            color: white;
        }

        .highlight {
            color: red;
        }
    </style>
</head>
<body>

    <h1>This is a centered h1 heading</h1>

    <p>This is a paragraph with blue text using internal CSS.</p>
    <p>This is another paragraph with blue text.</p>

    <button>Click Me</button>
    <button>Submit</button>

    <p class="highlight">This paragraph uses the .highlight class so its text is red.</p>

</body>
</html>
