<!DOCTYPE html>
<html>
    <head>
        <style>
            .login{
                width:250px;
                border:2px solid black;
                padding:20px;
                text-align:center;
                background-color:#b7a3a3;
                border-radius:30px;
            }
            input {
                width:100%;
                margin:10px;
                background-color:#0fff8c;border-radius:5px;
            }
            button{
                border-radius:5px;
                border-color:#252323;
                background-color:#a14c4c;
            }
        
        </style>
    </head>
    <body>
        <div class="login">
            <h3>Login</h3>
            <input type="text"placeholder="username"><br>
                <input type="password" placeholder="password"><br>
                    <button>Login</button>
                  </div>
    </body>
</html>
